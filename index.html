<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #688C5D;
    overflow-x: hidden;
}


/* Flower */
.flwr img {
    width: 310px;
    height: 350px;
    object-fit: contain;
    transition: transform 0.3s ease;
}

.flwr img:hover {
    transform: scale(1.1);
}


/* Background */
@keyframes move {
    100% {
        transform: translate3d(0, 0, 1px) rotate(360deg);
    }
}

.background {
    position: fixed;
    width: 100vw;
    height: 100vh;
    top: 0;
    left: 0;
    overflow: hidden;
    z-index: -1;
}

.background span {
    width: 1vmin;
    height: 1vmin;
    border-radius: 1vmin;
    backface-visibility: hidden;
    position: absolute;

    animation-name: move;
    animation-duration: 45s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}


/* Background particles */

.background span:nth-child(1) {
    color: #EFBF04;
    top: 34%;
    left: 30%;
    animation-duration: 9s;
    animation-delay: -22s;
    transform-origin: -21vw -12vh;
