<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="h1">Quick Question:</div>
    <div class="container">
        <p>Hello, <span id="nameSpan">{{name}}</span>!, Are you ready to enter into a relationship?</p>
        <p>choose a button bellow</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="willyou.html" id="yesBtn" class="btn btn-success">Yes</a>
            <a href="IfNo.html" id="noBtn" class="btn btn-danger">No</a>
        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { logEvent } from "./logger.js";

    const name = localStorage.getItem("userName") || "friend";
    document.getElementById("nameSpan").textContent = name;

    logEvent("page_view", { page: "hello" });

    async function handleChoice(e, choice, destination) {
        e.preventDefault();
        await logEvent("relationship_response", { choice });
        window.location.href = destination;
    }

    document.getElementById("yesBtn").addEventListener("click", (e) => handleChoice(e, "yes", "willyou.html"));
    document.getElementById("noBtn").addEventListener("click", (e) => handleChoice(e, "no", "IfNo.html"));
</script>
</body>
</html>
