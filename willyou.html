<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            text-align: center;
        }

        #reaction {
            display: none;
            max-width: 300px;
            max-height: 250px;
            margin: 25px auto;
            border-radius: 10px;
        }

        #noButton {
            position: relative;
            transition: transform 0.3s ease;
        }

        
    </style>
</head>

<body>
    <div class="container" style="margin-top: 100px;"> 
        <p class="h3"> Scroll Down! </p> 
    </div> 
    <div class ="container" style="margin-top: 10500px; margin-bottom: 1000px;"> 
        <p class="h3">Hi, scroll more to see!</p> 
    </div>
    <div class="container text-center" mt-5 style="margin-top: 100px; margin-bottom: 500px;">
        <h3 class="mt-5">
            Hi! Would you be my Girlfriend,<span id="nameSpan">{{name}}</span>? HAHHAHA
        </h3>
        <p>Choose a button below</p>
        <!-- GIF / Image appears here -->
        <img id="reaction" src="" alt="Reaction">

        <div class="d-flex justify-content-center align-items-center gap-3"
             style="min-height: 100px;">

            <a href="IfYes.html" id="yesBtn" class="btn btn-success px-4 py-2">Yes</a>

            <button id="noButton" type="button" class="btn btn-danger px-4 py-2">No</button>
        </div>

        <p id="message" class="mt-3 fw-bold"></p>
    </div>

    <script type="module">
        import { logEvent } from "./logger.js";

        const name = localStorage.getItem("userName") || "friend";
        document.getElementById("nameSpan").textContent = name;

        logEvent("page_view", { page: "willyou" });

        const noButton = document.getElementById("noButton");
        const reaction = document.getElementById("reaction");
        const message = document.getElementById("message");
        const yesButton = document.getElementById("yesBtn");

        let clickCount = 0;

        // Put your GIF/image filenames here
        const reactions = [
            "no1.gif",
            "no2.gif",
            "no3.gif",
            "no4.gif",
            "no5.gif",
            "no6.gif",
            "no7.gif",
            "no8.gif",
            "no9.gif",
            "no10.gif"
        ];

        yesButton.addEventListener("click", async function (e) {
            e.preventDefault();
            await logEvent("friend_response", { choice: "yes", noClicksBeforeYes: clickCount });
            window.location.href = "IfYes.html";
        });

        noButton.addEventListener("click", function () {

            clickCount++;

            // Show GIF/image
            reaction.src = reactions[clickCount - 1];
            reaction.style.display = "block";

            logEvent("friend_no_click", { clickNumber: clickCount, reaction: reactions[clickCount - 1] });

            // Move the No button
            if (clickCount <= 10) {

                const randomX = Math.floor(Math.random() * 300) - 150;
                const randomY = Math.floor(Math.random() * 200) - 100;

                noButton.style.transform =
                    `translate(${randomX}px, ${randomY}px)`;

            }

            // After 10 clicks
            if (clickCount === 10) {

                noButton.style.transform = "none";

                logEvent("friend_response", { choice: "no", totalNoClicks: clickCount });

                // Go to the new page after a short delay
                setTimeout(function () {
                    window.location.href = "Thanks.html";
                }, 1000);
            }

        });

    </script>

</body>
</html>
