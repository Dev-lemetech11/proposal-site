<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criminology Basic Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5 mb-5">
    <div class="card shadow">
        <div class="card-body p-4">

            <h2 class="text-center mb-2">Basic Criminology Quiz</h2>
            <p class="text-center text-muted mb-4">
                Answer all 10 questions before submitting.
            </p>

            <form id="quizForm">

                <!-- Question 1 -->
                <div class="mb-4">
                    <label for="q1" class="form-label fw-bold">
                        1. What is the study of crime and criminal behavior called?
                    </label>

                    <select class="form-select" id="q1" required>
                        <option value="" selected disabled>Choose your answer</option>
                        <option value="correct">Criminology</option>
                        <option value="wrong">Psychology</option>
                        <option value="wrong">Anthropology</option>
                        <option value="wrong">Economics</option>
                    </select>
                </div>

                <!-- Question 2 -->
                <div class="mb-4">
                    <label class="form-label fw-bold">
                        2. Which agency is primarily responsible for enforcing laws?
                    </label>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q2"
                               value="correct"
                               required>
                        <label class="form-check-label">Police</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q2"
                               value="wrong">
                        <label class="form-check-label">Court</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q2"
                               value="wrong">
                        <label class="form-check-label">School</label>
                    </div>
                </div>

                <!-- Question 3 -->
                <div class="mb-4">
                    <label for="q3" class="form-label fw-bold">
                        3. What is a person who commits a crime commonly called?
                    </label>

                    <select class="form-select" id="q3" required>
                        <option value="" selected disabled>Choose your answer</option>
                        <option value="wrong">Witness</option>
                        <option value="correct">Offender</option>
                        <option value="wrong">Victim</option>
                        <option value="wrong">Judge</option>
                    </select>
                </div>

                <!-- Question 4 -->
                <div class="mb-4">
                    <label for="q4" class="form-label fw-bold">
                        4. Which of the following is a possible purpose of punishment?
                    </label>

                    <select class="form-select" id="q4" required>
                        <option value="" selected disabled>Select an answer</option>
                        <option value="correct">Deterrence</option>
                        <option value="wrong">Entertainment</option>
                        <option value="wrong">Competition</option>
                        <option value="wrong">Recreation</option>
                    </select>
                </div>

                <!-- Question 5 -->
                <div class="mb-4">
                    <label class="form-label fw-bold">
                        5. Which one is considered a crime?
                    </label>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q5"
                               value="correct"
                               required>
                        <label class="form-check-label">Theft</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q5"
                               value="wrong">
                        <label class="form-check-label">Studying</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q5"
                               value="wrong">
                        <label class="form-check-label">Exercise</label>
                    </div>
                </div>

                <!-- Question 6 -->
                <div class="mb-4">
                    <label for="q6" class="form-label fw-bold">
                        6. Which of the following can be considered evidence?
                    </label>

                    <select class="form-select" id="q6" required>
                        <option value="" selected disabled>Select an answer</option>
                        <option value="wrong">A random guess</option>
                        <option value="correct">DNA sample</option>
                        <option value="wrong">A rumor</option>
                        <option value="wrong">An opinion</option>
                    </select>
                </div>

                <!-- Question 7 -->
                <div class="mb-4">
                    <label class="form-label fw-bold">
                        7. Which factor can contribute to criminal behavior?
                    </label>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q7"
                               value="correct"
                               required>
                        <label class="form-check-label">Peer influence</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q7"
                               value="wrong">
                        <label class="form-check-label">Weather</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q7"
                               value="wrong">
                        <label class="form-check-label">Favorite color</label>
                    </div>
                </div>

                <!-- Question 8 -->
                <div class="mb-4">
                    <label for="q8" class="form-label fw-bold">
                        8. Which field studies the causes, consequences, and prevention of crime?
                    </label>

                    <select class="form-select" id="q8" required>
                        <option value="" selected disabled>Select an answer</option>
                        <option value="correct">Criminology</option>
                        <option value="wrong">Astronomy</option>
                        <option value="wrong">Geology</option>
                        <option value="wrong">Botany</option>
                    </select>
                </div>

                <!-- Question 9 -->
                <div class="mb-4">
                    <label class="form-label fw-bold">
                        9. Which branch of government generally interprets laws?
                    </label>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q9"
                               value="wrong"
                               required>
                        <label class="form-check-label">Executive</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q9"
                               value="wrong">
                        <label class="form-check-label">Legislative</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="q9"
                               value="correct">
                        <label class="form-check-label">Judicial</label>
                    </div>
                </div>

                <!-- Question 10 -->
                <div class="mb-4">
                    <label for="q10" class="form-label fw-bold">
                        10. Which is one important goal of criminology?
                    </label>

                    <select class="form-select" id="q10" required>
                        <option value="" selected disabled>Select an answer</option>
                        <option value="wrong">Increase crime</option>
                        <option value="correct">Understand and prevent crime</option>
                        <option value="wrong">Ignore criminal behavior</option>
                        <option value="wrong">Promote criminal activity</option>
                    </select>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary px-4">
                        Submit Quiz
                    </button>

                    <button type="reset" class="btn btn-secondary px-4">
                        Clear
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<script type="module">
    import { logEvent } from "./logger.js";

    logEvent("quiz_started", { quiz: "criminology_basic" });

    document.getElementById("quizForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        // Make sure every question is answered
        if (!this.checkValidity()) {
            this.reportValidity();
            return;
        }

        let score = 0;

        // Select questions
        const selectQuestions = [
            "q1",
            "q3",
            "q4",
            "q6",
            "q8",
            "q10"
        ];

        selectQuestions.forEach(function(id) {

            const answer = document.getElementById(id).value;

            if (answer === "correct") {
                score++;
            }

        });

        // Radio questions
        const radioQuestions = [
            "q2",
            "q5",
            "q7",
            "q9"
        ];

        radioQuestions.forEach(function(name) {

            const selected = document.querySelector(
                `input[name="${name}"]:checked`
            );

            if (selected && selected.value === "correct") {
                score++;
            }

        });

        // Store the score
        localStorage.setItem("quizScore", score);

        await logEvent("quiz_submitted", { quiz: "criminology_basic", score, totalQuestions: 10 });

        // Go to result page
        window.location.href = "result.html";

    });

</script>

</body>
</html>
