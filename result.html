<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .result-card {
            max-width: 600px;
            margin: 100px auto;
        }

        .trophy {
            font-size: 70px;
        }

        .score {
            font-size: 50px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card shadow result-card text-center">
        <div class="card-body p-5">

            <div class="trophy">🏆</div>

            <h1 class="mt-3">Congratulations!</h1>

            <p class="lead">
                You have completed the Basic Criminology Quiz.
            </p>

            <p class="text-muted">
                Here is your final score:
            </p>

            <div class="score text-primary" id="score">
                0/10
            </div>

            <div id="message" class="mt-3"></div>

            <p class="mt-4 h5 text-muted">
               Thank you for participating! We hope you enjoyed the quiz.
            </p>

        </div>
    </div>

</div>

<script type="module">
    import { logEvent } from "./logger.js";

    const score = localStorage.getItem("quizScore");

    const scoreElement = document.getElementById("score");
    const messageElement = document.getElementById("message");

    if (score !== null) {

        scoreElement.textContent = `${score}/10`;

        if (score == 10) {

            messageElement.innerHTML = `
                <div class="alert alert-success">
                    <strong>Perfect Score! 🎉</strong><br>
                    Outstanding work! You answered every question correctly.
                </div>
            `;

        } else if (score >= 8) {

            messageElement.innerHTML = `
                <div class="alert alert-success">
                    <strong>Excellent Work! 👏</strong><br>
                    You have demonstrated a strong understanding of criminology.
                </div>
            `;

        } else if (score >= 5) {

            messageElement.innerHTML = `
                <div class="alert alert-warning">
                    <strong>Good Job! 👍</strong><br>
                    You have a good foundation. Keep studying to improve your score.
                </div>
            `;

        } else {

            messageElement.innerHTML = `
                <div class="alert alert-danger">
                    <strong>Keep Learning! 📚</strong><br>
                    Review the basics of criminology and try the quiz again.
                </div>
            `;

        }

    } else {

        scoreElement.textContent = "No Score";

        messageElement.innerHTML = `
            <div class="alert alert-info">
                Please complete the quiz first.
            </div>
        `;

    }

    logEvent("result_viewed", { score });
</script>

</body>
</html>
